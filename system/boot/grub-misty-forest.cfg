# Text boot with the system palette (installed as /etc/default/grub.d/misty-forest.cfg).
# Read by update-grub after /etc/default/grub, so these values win.
#
# - no "quiet splash": systemd shows its "[  OK  ]" lines; loglevel=3 keeps only kernel errors
# - plymouth.enable=0: no graphical splash
# - vt.default_*: the 16 console colours, same as kitty (0 = background #1c2225, 7 = text #d3dad5)
# - GRUB_BACKGROUND: plain #1c2225 instead of Debian's blue image, shown for an instant even with
#   the menu hidden

GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_BACKGROUND=/boot/grub/misty-forest-background.png
GRUB_CMDLINE_LINUX_DEFAULT="loglevel=3 plymouth.enable=0 vt.default_red=28,192,155,201,127,168,131,211,108,212,176,218,150,188,154,230 vt.default_grn=34,122,176,179,156,143,172,218,122,144,197,199,178,163,194,235 vt.default_blu=37,110,138,124,173,168,168,213,126,127,156,145,194,187,189,231"
