# greetd on tty1 (installed as /etc/systemd/system/greetd.service.d/tty1.conf).
# Takes tty1 from getty and starts only once the boot jobs are done (Type=idle),
# so the last systemd messages don't print over the login.
[Unit]
After=getty@tty1.service
Conflicts=getty@tty1.service

[Service]
Type=idle
